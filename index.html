<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NINE HUB</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{font-family:'Prompt',sans-serif!important}.glass{background:rgba(15,23,42,0.6);backdrop-filter:blur(16px);border:1px solid rgba(56,189,248,0.15)}</style>
</head>
<body class="bg-[#070d1a] text-white min-h-screen p-4">
<div class="max-w-2xl mx-auto">
<div class="glass rounded-[2rem] p-3 flex justify-between items-center mb-6">
<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-blue-950 border border-cyan-400/50 flex items-center justify-center"><span class="text-cyan-300 font-bold text-sm">NS</span></div><div><h1 class="text-white font-bold text-sm">NINE SCRIPTS</h1><p class="text-[10px] text-blue-300/70">ศูนย์รวมสคริปต์</p></div></div>
<div class="flex gap-2"><button onclick="location.reload()" class="glass px-3 py-1.5 rounded-xl text-xs text-blue-200">↻ รีเฟรช</button><a href="https://discord.gg/enq9Cy4nwa" target="_blank" class="glass px-3 py-1.5 rounded-xl text-xs text-cyan-300">Discord ↗</a></div>
</div>
<div class="text-center mb-6">
<div class="w-20 h-20 mx-auto rounded-full bg-[#0B1221] border border-cyan-400 flex items-center justify-center mb-4"><span class="text-cyan-300 font-bold text-lg">NINE</span></div>
<h2 class="text-3xl font-bold mb-2">ค้นหา แล้วเริ่มใช้<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">NINE SCRIPTS</span></h2>
<p class="text-blue-200/70 text-sm mb-4">รวมสคริปต์ไว้ในที่เดียว ค้นหาชื่อหรือแมพที่รองรับ เปิดดูรายละเอียด แล้วคัดลอกโค้ดได้ทันที</p>
</div>
<div class="grid grid-cols-3 gap-3 mb-6">
<div class="glass rounded-2xl p-3 text-center"><span id="s-success" class="text-xl font-bold">0</span><p class="text-[10px] text-blue-300">แกะสำเร็จ</p></div>
<div class="glass rounded-2xl p-3 text-center"><span class="text-xl font-bold">1752</span><p class="text-[10px] text-blue-300">ยอดเข้าชม</p></div>
<div class="glass rounded-2xl p-3 text-center"><span id="s-time" class="text-xl font-bold">-</span><p class="text-[10px] text-blue-300">อัปเดตล่าสุด</p></div>
</div>
<div class="glass rounded-2xl p-4">
<div class="flex justify-between mb-2"><span class="text-xs font-bold text-cyan-300">INPUT</span><button id="pb" class="glass px-2 py-1 text-xs text-cyan-300 rounded">วาง</button></div>
<textarea id="ui" class="w-full h-24 bg-black/40 border border-cyan-500/30 rounded-xl p-2 text-xs text-white mb-3 outline-none"></textarea>
<div class="flex justify-between mb-2"><span class="text-xs font-bold text-cyan-300">OUTPUT</span><span id="lc" class="text-xs text-blue-300">0 LINES</span></div>
<textarea id="lo" readonly class="w-full h-24 bg-black/40 border border-cyan-500/30 rounded-xl p-2 text-xs text-green-400 mb-3 outline-none"></textarea>
<div class="grid grid-cols-3 gap-2"><button id="cb" class="glass py-2 text-xs font-bold text-cyan-300 rounded-xl">คัดลอก</button><button id="db" class="glass py-2 text-xs font-bold text-cyan-300 rounded-xl">ดาวน์โหลด</button><button id="cl" class="glass py-2 text-xs font-bold text-red-400 rounded-xl">ล้าง</button></div>
</div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import{getDatabase,ref,get,onValue}from"https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";
const db=getDatabase(initializeApp({databaseURL:"https://nine-991-default-rtdb.asia-southeast1.firebasedatabase.app"}));
let a;
const play=()=>{try{if(!a)a=new(window.AudioContext||window.webkitAudioContext)();if(a.state==='suspended')a.resume();const o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(600,n);o.frequency.exponentialRampToValueAtTime(300,n+0.1);g.gain.setValueAtTime(0.2,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.1);o.start(n);o.stop(n+0.1)}catch(e){}};
document.addEventListener('click',e=>{if(e.target.closest('button')||e.target.closest('a')){play();if(navigator.vibrate)navigator.vibrate(15)}});
onValue(ref(db,'extractions'),s=>{const d=s.val();if(d){const l=Object.values(d);let c=0;l.forEach(i=>{if(i.status==='success')c++});document.getElementById('s-success').innerText=c;if(l.length)document.getElementById('s-time').innerText=l[l.length-1].time.split(' ')[1]||'-'}});
get(ref(db,'secret_payloads/script_1')).then(s=>{if(s.exists()){document.getElementById('lo').value=s.val();document.getElementById('lc').innerText=s.val().split(/\r\n|\r|\n/).length+' LINES'}});
document.getElementById('pb').onclick=async()=>{try{document.getElementById('ui').value=await navigator.clipboard.readText()}catch{alert('วางไม่ได้')}};
document.getElementById('cb').onclick=()=>{const v=document.getElementById('lo').value;if(v){navigator.clipboard.writeText(v);alert('คัดลอกแล้ว')}};
document.getElementById('db').onclick=()=>{const v=document.getElementById('lo').value;if(v){const b=new Blob([v]),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='script.lua';x.click()}};
document.getElementById('cl').onclick=()=>{document.getElementById('ui').value='';document.getElementById('lo').value='';document.getElementById('lc').innerText='0 LINES'};
</script>
</body>
</html>
