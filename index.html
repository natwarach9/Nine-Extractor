<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>NINE HUB - Deobfuscator</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 30px; max-width: 800px; margin: auto; }
        h2 { color: #4CAF50; }
        textarea { width: 100%; height: 180px; background: #1e1e1e; color: #fff; border: 1px solid #333; padding: 12px; margin-bottom: 15px; border-radius: 6px; font-family: monospace; font-size: 14px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; padding: 12px 25px; cursor: pointer; font-size: 16px; border-radius: 6px; font-weight: bold; }
        button:hover { background: #45a049; }
        .status { margin-bottom: 15px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <h2>NINE HUB | EXTRACTOR</h2>
    <div class="status">สถานะ: เชื่อมต่อกับ Backend บน Render เรียบร้อย</div>
    
    <label>วางโค้ดที่ต้องการแกะ:</label>
    <textarea id="inputCode" placeholder="วางโค้ด Lua ตรงนี้..."></textarea>
    
    <button onclick="runDeobfuscate()">แกะโค้ด</button>
    
    <p style="margin-top: 20px;">ผลลัพธ์:</p>
    <textarea id="outputCode" placeholder="ผลลัพธ์จะแสดงที่นี่..." readonly></textarea>

    <script>
        async function runDeobfuscate() {
            const code = document.getElementById('inputCode').value;
            const output = document.getElementById('outputCode');
            
            if (!code.trim()) {
                alert("กรุณาใส่โค้ดก่อนครับ!");
                return;
            }

            output.value = "กำลังประมวลผล... (หากไม่ได้ใช้นาน เซิร์ฟเวอร์อาจใช้เวลาปลุกตัวประมาณ 30 วินาที)";

            try {
                const response = await fetch('https://nine-extractor-backend.onrender.com/deobfuscate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });

                const data = await response.json();
                if (data.success) {
                    output.value = data.deobfuscated_code;
                } else {
                    output.value = "Error: " + (data.error || "เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ");
                }
            } href (err) {
                output.value = "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: " + err;
            }
        }
    </script>
</body>
</html>
