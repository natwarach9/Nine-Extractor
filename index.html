<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Deobfuscator Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
        }
        .editor-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: bold;
            color: #b0b0b0;
        }
        textarea {
            width: 100%;
            height: 200px;
            background-color: #2d2d2d;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            border-color: #007acc;
            outline: none;
        }
        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #005999;
        }
        #status {
            text-align: center;
            font-style: italic;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Lua Deobfuscator Hub</h2>
        <div class="editor-container">
            <div>
                <label for="inputCode">วางโค้ดที่ต้องการ Deobfuscate:</label>
                <textarea id="inputCode" placeholder="วางสคริปต์ตรงนี้..."></textarea>
            </div>
            
            <button onclick="runDeobfuscate()">เริ่มถอดรหัส (Deobfuscate)</button>
            <div id="status"></div>

            <div>
                <label for="outputCode">ผลลัพธ์:</label>
                <textarea id="outputCode" placeholder="ผลลัพธ์จะแสดงที่นี่..." readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        const CLOUDFLARE_API_URL = 'https://moonsec-deop.natwarach9.workers.dev/deobf';

        async function runDeobfuscate() {
            const inputCode = document.getElementById('inputCode').value;
            const outputBox = document.getElementById('outputCode');
            const statusBox = document.getElementById('status');

            if (!inputCode.trim()) {
                alert('กรุณาใส่โค้ดก่อนกดถอดรหัส!');
                return;
            }

            statusBox.innerText = 'กำลังประมวลผล...';
            outputBox.value = '';

            try {
                const response = await fetch(CLOUDFLARE_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code: inputCode })
                });

                if (!response.ok) {
                    throw new Error('เกิดข้อผิดพลาดจากเซิร์ฟเวอร์ (Status: ' + response.status + ')');
                }

                const data = await response.json();
                
                if (data.result || data.code) {
                    outputBox.value = data.result || data.code;
                    statusBox.innerText = 'ถอดรหัสสำเร็จ!';
                } else if (typeof data === 'string') {
                    outputBox.value = data;
                    statusBox.innerText = 'ถอดรหัสสำเร็จ!';
                } else {
                    outputBox.value = JSON.stringify(data, null, 2);
                    statusBox.innerText = 'ถอดรหัสสำเร็จ (รูปแบบข้อมูลดิบ)';
                }

            } catch (error) {
                console.error(error);
                statusBox.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
                outputBox.value = 'Error: ' + error.message;
            }
        }
    </script>

</body>
</html>
